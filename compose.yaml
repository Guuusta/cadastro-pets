# ============================================================
# Cadastro de Pets: tudo que roda junto, num arquivo só.
# Subir:   docker compose up -d --build
# Parar:   docker compose down        (os dados ficam no volume)
# Os valores ${...} vêm do arquivo .env. A senha do banco vem de secrets/db_password.txt
# ============================================================
name: cadastro-pets

# ---------- Configuração de logs, reaproveitada por todos os serviços ----------
# "&logs" cria um "atalho" (âncora YAML); cada serviço usa com "logging: *logs".
# Rotação: cada container guarda no máximo 3 arquivos de 10 MB (não enche o disco)
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------- Banco de dados ----------
  db:
    image: postgres:18.6-alpine              # versão exata (não "latest")
    environment:
      POSTGRES_DB: ${POSTGRES_DB}            # cria o banco na 1ª vez
      POSTGRES_USER: ${POSTGRES_USER}        # cria o usuário na 1ª vez
      # A senha NÃO fica aqui: o Postgres lê do arquivo do secret
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password                          # monta o secret em /run/secrets/db_password
    volumes:
      # VOLUME: os dados do banco moram aqui, FORA do container.
      # (no Postgres 18, a pasta de dados fica dentro de /var/lib/postgresql)
      - db-dados:/var/lib/postgresql
    healthcheck:
      # "pg_isready" = ferramenta do próprio Postgres: "você já aceita conexões?"
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s           # pergunta a cada 5s
      timeout: 3s            # se não responder em 3s, conta como falha
      retries: 10            # 10 falhas seguidas = unhealthy
      start_period: 10s      # tempo de "aquecimento": falhas aqui não contam
    logging: *logs
    restart: unless-stopped
    networks:
      - backend              # SÓ na rede interna: proxy e web nem enxergam o banco

  # ---------- API ----------
  api:
    build: ./api                                     # constrói a partir do api/Dockerfile...
    image: ${REGISTRY:-ghcr.io/guuusta}/cadastro-pets-api:${API_VERSION}   # ...e dá esta tag (o mesmo nome publicado pelo CI)
    environment:
      # Cada dado numa variável separada: a API monta o endereço do banco
      # e trata caracteres especiais da senha (como @)
      DB_HOST: db                            # "db" = nome do serviço acima
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password   # a senha vem do secret, não de variável
      ROOT_PATH: /api                        # atrás do proxy, a API mora em /api
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy           # só liga DEPOIS que o banco estiver pronto de verdade
    healthcheck:
      # Chama o /health da própria API (que testa o banco). A imagem slim não tem curl,
      # então usamos o próprio Python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *logs
    restart: unless-stopped
    networks:
      - frontend             # recebe pedidos do proxy
      - backend              # e é a ÚNICA que fala com o banco

  # ---------- Web ----------
  web:
    build: ./web
    image: ${REGISTRY:-ghcr.io/guuusta}/cadastro-pets-web:${WEB_VERSION}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logs
    restart: unless-stopped
    networks:
      - frontend

  # ---------- Proxy reverso (a "portaria") ----------
  proxy:
    image: nginx:1.30.5-alpine               # versão estável, fixa
    ports:
      - "${PROXY_PORT:-80}:80"               # HTTP: só redireciona para o HTTPS
      - "${PROXY_HTTPS_PORT:-443}:443"       # HTTPS: a entrada de verdade
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # nossa config, só leitura
      - ./proxy/certs:/etc/nginx/certs:ro    # certificado HTTPS (gerado por scripts/gerar-certificado.sh)
    depends_on:
      api:
        condition: service_healthy           # só abre a portaria quando API...
      web:
        condition: service_healthy           # ...e Web estiverem saudáveis
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logs
    restart: unless-stopped
    networks:
      - frontend             # só a "recepção": não tem acesso ao banco

# ---------- Secrets (senhas em arquivo, fora das variáveis de ambiente) ----------
secrets:
  db_password:
    file: ./secrets/db_password.txt          # este arquivo NÃO vai para o Git (.gitignore)

# ---------- Volumes ----------
volumes:
  db-dados:              # volume nomeado, gerenciado pelo Docker

# ---------- Redes (segmentação: cada um só enxerga o que precisa) ----------
networks:
  frontend:              # "recepção": proxy, web e api
  backend:               # "cofre": só api e banco
    internal: true       # sem saída para a internet
