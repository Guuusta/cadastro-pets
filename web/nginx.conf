# Log em JSON, no mesmo padrão do proxy e da API.
# $http_x_request_id = o "número de protocolo" que o proxy mandou
log_format json_organizado escape=json
  '{"hora":"$time_iso8601","servico":"web","request_id":"$http_x_request_id",'
  '"metodo":"$request_method","caminho":"$request_uri","status":$status,'
  '"duracao_s":$request_time}';

# Servidor web DA APLICAÇÃO WEB (só entrega os arquivos HTML/JS/CSS).
# Não confundir com o proxy reverso da fase 4, que fica na frente de tudo.
server {
    # 8080, porque a imagem "unprivileged" não roda como root
    # e usuário comum não pode usar portas abaixo de 1024
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout json_organizado;

    # Rota de saúde (usada no healthcheck da fase 5)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
