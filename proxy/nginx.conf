# ---------- Formato do log: uma linha JSON por pedido ----------
# $request_id = "número de protocolo" único, gerado pelo Nginx para cada pedido
log_format json_organizado escape=json
  '{"hora":"$time_iso8601","servico":"proxy","request_id":"$request_id",'
  '"metodo":"$request_method","caminho":"$request_uri","status":$status,'
  '"duracao_s":$request_time,"destino":"$upstream_addr",'
  '"ip_cliente":"$remote_addr","navegador":"$http_user_agent"}';

# ============================================================
# PROXY REVERSO: a "portaria" do sistema. Único serviço exposto para fora.
#   http://...   -> redireciona para https://
#   https://meuhost.local/web/...  e  /api/...
#   meuhost.local/web/...  ->  container "web" (porta 8080)
#   meuhost.local/api/...  ->  container "api" (porta 8000)
# ============================================================
# Ajuda para o WebSocket do Grafana: só pede "upgrade" quando o navegador pediu
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============================================================
# HTTP (porta 80): só manda todo mundo para o HTTPS
# ============================================================
server {
    listen 80;
    server_name meuhost.local localhost;
    access_log /dev/stdout json_organizado;

    # O healthcheck do Docker continua usando HTTP interno (sem certificado)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Qualquer outro pedido: "use a versão segura" (301 = mudou de endereço para sempre)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 443 = porta padrão do HTTPS
    listen 443 ssl;
    http2 on;                                   # protocolo mais moderno e rápido
    server_name meuhost.local localhost;

    # O "RG" do site (certificado) e a chave que só o servidor tem
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;        # só versões seguras do protocolo

    # Todos os pedidos deste site vão para o log no formato JSON acima
    # (/dev/stdout = saída padrão: o Docker recolhe, igual na API)
    access_log /dev/stdout json_organizado;

    # Saúde do próprio proxy (usada pelo healthcheck do Docker)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Quem acessar só "meuhost.local" vai direto para a Web
    location = / {
        return 302 /web/;
    }

    # Sem a barra final, o navegador se perderia nos arquivos relativos
    # (style.css, app.js). Então /web vira /web/ (e o mesmo para /api)
    location = /web { return 301 /web/; }
    location = /api { return 301 /api/; }

    # ---------- Web ----------
    location /web/ {
        # A BARRA no final remove o prefixo: /web/app.js chega na Web como /app.js
        proxy_pass http://web:8080/;
        proxy_set_header X-Request-ID $request_id;                    # passa o "número de protocolo" adiante
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;                       # IP de quem acessou
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;                    # http ou https
    }

    # ---------- API ----------
    # As métricas são só para o Prometheus (pela rede interna). De fora: 404
    location = /api/metrics {
        return 404;
    }

    location /api/ {
        # /api/pets chega na API como /pets
        proxy_pass http://api:8000/;
        proxy_set_header X-Request-ID $request_id;                    # passa o "número de protocolo" adiante
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Grafana (monitoramento) ----------
    location = /grafana { return 301 /grafana/; }

    location /grafana/ {
        # O Grafana só roda com o "perfil" de monitoramento ligado.
        # Usando uma VARIÁVEL + resolver, o Nginx só procura o "grafana" na hora do pedido:
        # se o monitoramento estiver desligado, dá 502 nesse caminho, mas o proxy NÃO cai
        # (lembra do exercício 2? Nginx não subia quando um destino não existia)
        resolver 127.0.0.11 valid=10s;          # DNS interno do Docker
        set $grafana http://grafana:3000;
        proxy_pass $grafana;                     # repassa o caminho inteiro (/grafana/...)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # O Grafana atualiza os painéis ao vivo por WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Qualquer outro caminho: 404 (não expõe nada além do que queremos)
    location / {
        return 404;
    }
}
