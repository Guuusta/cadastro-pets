# "Provisionamento": o Grafana já nasce configurado, sem clicar em nada.
# Fontes de dados: de onde o Grafana busca números (Prometheus) e logs (Loki)
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
